server {
    listen       8080;
    server_name  localhost;
    root         /usr/share/nginx/html;

    # Hashed build output: cache forever, and 404 (not index.html) for chunks
    # that no longer exist after a redeploy.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Regenerated at container start by 99-vite-envsubst.sh.
    location = /env-config.js {
        add_header Cache-Control "no-cache";
    }

    # vue-router uses HTML5 history mode: any path that isn't a real file
    # (e.g. /proposals/<id> on reload) must serve the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
